transforms:
  - name: world_to_dual_arm_base
    parent_frame_id: world
    child_frame_id: dual_arm_base
    xyz: [0.0, 0.0, 0.0]
    quat_xyzw: [0.0, 0.0, 0.0, 1.0]
  - name: dual_arm_base_to_left_base
    parent_frame_id: dual_arm_base
    child_frame_id: left_base_link
    xyz: [-0.45, 0.0, 0.0]
    quat_xyzw: [0.0, 0.0, 0.7071068, 0.7071068]
  - name: dual_arm_base_to_right_base
    parent_frame_id: dual_arm_base
    child_frame_id: right_base_link
    xyz: [0.45, 0.0, 0.0]
    quat_xyzw: [0.0, 0.0, -0.7071068, 0.7071068]
  - name: left_tool_to_tcp
    parent_frame_id: left_tool0
    child_frame_id: left_tcp
    xyz: [0.0, 0.0, 0.115]
    quat_xyzw: [0.0, 0.0, 0.0, 1.0]
  - name: right_tool_to_tcp
    parent_frame_id: right_tool0
    child_frame_id: right_tcp
    xyz: [0.0, 0.0, 0.115]
    quat_xyzw: [0.0, 0.0, 0.0, 1.0]
  - name: left_tcp_to_camera
    parent_frame_id: left_tcp
    child_frame_id: left_camera_color_optical_frame
    xyz: [0.035, -0.025, 0.055]
    quat_xyzw: [0.5, -0.5, 0.5, -0.5]
  - name: right_tcp_to_camera
    parent_frame_id: right_tcp
    child_frame_id: right_camera_color_optical_frame
    xyz: [0.035, 0.025, 0.055]
    quat_xyzw: [0.5, -0.5, 0.5, -0.5]

calibration_status:
  base_transform_source: "placeholder, replace with measured dual-arm base survey"
  tcp_source: "placeholder, replace after gripper/hook TCP calibration"
  target_tcp_repeatability_mm: 0.5
